        // 主题预设：优先跟随系统浅色/深色，无法检测时按日出日落时间（6-18 点浅色，其余深色）
        (function(){
            document.documentElement.classList.add('theme-lock');
            var theme;
            var mq = window.matchMedia('(prefers-color-scheme: dark)');
            if (mq.media !== 'not all') {
                theme = mq.matches ? 'dark' : 'light';
            } else {
                var h = new Date().getHours();
                theme = (h >= 6 && h < 18) ? 'light' : 'dark';
            }
            document.documentElement.setAttribute('data-theme', theme);
            document.documentElement.style.colorScheme = theme;
            requestAnimationFrame(function(){
                requestAnimationFrame(function(){
                    document.documentElement.classList.remove('theme-lock');
                });
            });
        })();

<!-- 9. 联系我们弹窗控制（NT-Studio 同款） -->
<script>
    // ==================== 联系我们弹窗控制 ====================
    (function() {
        var modal = document.getElementById('contact-modal');
        var card = document.getElementById('contact-card');
        var closeBtn = document.getElementById('contact-modal-close');
        var panel = modal ? modal.querySelector('.contact-modal-panel') : null;
        if (!modal || !card) return;

        var lastFocus = null;

        // 滚动条宽度补偿：锁滚动条时给 body 加等宽 padding，避免内容横向位移（跳动）
        var scrollBarW = 0;
        var bodyPaddingRight = '';
        var bodyOverflow = '';

        function lockScroll() {
            bodyPaddingRight = document.body.style.paddingRight;
            bodyOverflow = document.body.style.overflow;
            scrollBarW = window.innerWidth - document.documentElement.clientWidth;
            document.body.style.overflow = 'hidden';
            if (scrollBarW > 0) {
                document.body.style.paddingRight = scrollBarW + 'px';
            }
        }

        function unlockScroll() {
            document.body.style.overflow = bodyOverflow;
            document.body.style.paddingRight = bodyPaddingRight;
        }

        function openModal() {
            lastFocus = document.activeElement;
            modal.hidden = false;
            lockScroll();
            // 触发过渡动画
            requestAnimationFrame(function() {
                requestAnimationFrame(function() {
                    modal.classList.add('is-open');
                });
            });
            card.classList.add('is-hidden');
            if (closeBtn) closeBtn.focus();
        }

        function closeModal() {
            modal.classList.remove('is-open');
            // 面板动画结束后再收起容器并恢复滚动条，
            // 避免提前解锁导致滚动条消失、页面横向位移（视觉上"跳动"一下）
            var target = panel || modal;
            var finished = false;
            var finish = function() {
                if (finished) return;
                finished = true;
                target.removeEventListener('transitionend', onEnd);
                clearTimeout(fallback);
                modal.hidden = true;
                unlockScroll();
                card.classList.remove('is-hidden');
            };
            var onEnd = function(e) {
                // 面板退出只过渡 opacity（transform 不参与过渡），故监听 opacity
                if (e.target !== target || e.propertyName !== 'opacity') return;
                finish();
            };
            target.addEventListener('transitionend', onEnd);
            // 兜底：若动画被跳过（如 prefers-reduced-motion），延时后直接收起
            var fallback = setTimeout(function() {
                if (!modal.classList.contains('is-open')) finish();
            }, 500);
            if (lastFocus && lastFocus.focus) lastFocus.focus();
        }

        card.addEventListener('click', openModal);
        card.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openModal(); }
        });

        if (closeBtn) {
            closeBtn.addEventListener('click', closeModal);
            closeBtn.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); closeModal(); }
            });
        }

        // 点击遮罩关闭
        modal.querySelectorAll('[data-contact-close]').forEach(function(el) {
            el.addEventListener('click', closeModal);
        });

        // ESC 关闭
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' && !modal.hidden) closeModal();
        });

        // 纯文本联系方式（邮箱/QQ/微信）：点击或回车复制到剪贴板，不跳转
        function copyText(text, el) {
            var v = el.querySelector('.contact-item-value');
            var feedback = function(ok) {
                if (!v || v.dataset.copied) return;
                var original = v.textContent;
                v.dataset.copied = '1';
                v.textContent = ok ? '已复制' : '复制失败';
                setTimeout(function() { v.textContent = original; delete v.dataset.copied; }, 1200);
            };
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(function() { feedback(true); })
                    .catch(function() { feedback(false); });
            } else {
                feedback(false);
            }
        }

        modal.querySelectorAll('[data-contact-copy]').forEach(function(el) {
            var trigger = function() { copyText(el.getAttribute('data-contact-copy'), el); };
            el.addEventListener('click', trigger);
            el.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); trigger(); }
            });
        });
    })();
</script>
